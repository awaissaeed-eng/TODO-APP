<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tasks</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="shell">
        
      <!-- ===== sidebar ===== -->
      <aside class="sidebar">
        <div class="brand">
          <span class="brand-mark"></span>
          <span class="brand-name">Tasks</span>
        </div>

        <nav class="nav-section">
          <button class="nav-item active" data-filter="all">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <rect x="3" y="3" width="7" height="7" rx="1.5" />
              <rect x="14" y="3" width="7" height="7" rx="1.5" />
              <rect x="3" y="14" width="7" height="7" rx="1.5" />
              <rect x="14" y="14" width="7" height="7" rx="1.5" />
            </svg>
            All Tasks
          </button>
          <button class="nav-item" data-filter="active">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <circle cx="12" cy="12" r="9" />
              <path d="M12 7v5l3 3" />
            </svg>
            Active
          </button>
          <button class="nav-item" data-filter="completed">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" />
              <polyline points="22 4 12 14.01 9 11.01" />
            </svg>
            Completed
          </button>
        </nav>

        <div class="nav-section feature-categories">
          <p class="nav-label">Categories</p>
          <div id="categoryNav"><!-- injected --></div>
        </div>

        <div class="sidebar-bottom">
          <button
            class="theme-toggle"
            id="themeToggle"
            aria-label="Toggle theme"
          >
            <svg
              class="icon-sun"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <circle cx="12" cy="12" r="4" />
              <path
                d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"
              />
            </svg>
            <svg
              class="icon-moon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
            </svg>
            <span id="themeLabel">Dark mode</span>
          </button>
        </div>
      </aside>

      <!-- ===== main ===== -->
      <main class="main">
        <header class="main-header">
          <div>
            <p class="greeting" id="greeting"></p>
            <p class="date" id="date"></p>
          </div>
          <div class="stats-row" id="statsRow"><!-- injected --></div>
        </header>

        <div class="progress-row feature-progressBar">
          <span id="counterText">0 of 0 completed</span>
          <div class="progress-track">
            <div class="progress-fill" id="progressFill"></div>
          </div>
        </div>

        <form class="add-form" id="addForm">
          <input
            type="text"
            id="taskInput"
            placeholder="Add a task…"
            autocomplete="off"
            maxlength="200"
          />
          <select
            id="categorySelect"
            class="feature-categories"
            aria-label="Category"
          ></select>
          <select
            id="prioritySelect"
            class="feature-priority"
            aria-label="Priority"
          >
            <option value="none">No priority</option>
            <option value="high">High</option>
            <option value="medium">Medium</option>
            <option value="low">Low</option>
          </select>
          <input
            type="date"
            id="dueDateInput"
            class="feature-dueDates"
            aria-label="Due date"
          />
          <button type="submit" class="add-btn">Add</button>
        </form>

        <div class="toolbar-row">
          <input
            type="text"
            id="searchInput"
            class="feature-search"
            placeholder="Search tasks…"
            autocomplete="off"
          />
          <button class="clear-btn feature-clearCompleted" id="clearCompleted">
            Clear completed
          </button>
        </div>

        <ul class="task-list" id="taskList"></ul>

        <div class="empty-state" id="emptyState">
          <svg
            viewBox="0 0 64 64"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
          >
            <rect x="14" y="10" width="36" height="46" rx="3" />
            <path d="M22 24h20M22 32h20M22 40h12" />
          </svg>
          <p class="empty-title">No tasks yet</p>
          <p class="empty-sub">Add your first task above to get started.</p>
        </div>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
